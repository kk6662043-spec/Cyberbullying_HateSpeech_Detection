<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SafeText AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <section class="login-page">

        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">

                <div class="logo-shield">
                    🛡️
                </div>

                <div class="logo-text">
                    <h1>SafeText</h1>
                    <span>AI</span>
                </div>

            </div>

            <p class="login-tagline">
                AI-Powered Text Safety
            </p>


            <!-- Login Title -->

            <div class="login-heading">

                <h2>Welcome Back</h2>

                <p>
                    Sign in to continue to SafeText AI
                </p>

            </div>


            <!-- Error Message -->

            {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

            {% endif %}


            <!-- Login Form -->

            <form method="POST">

                <div class="input-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>


            <!-- Register -->

            <div class="register-link">

                <span>Don't have an account?</span>

                <a href="/register">
                    Create Account
                </a>

            </div>


            <!-- Back to Home -->

            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>


    <footer class="login-footer">

        <p>
            © 2026 SafeText AI |
            Cyberbullying & Hate Speech Detection
        </p>

    </footer>

</body>

</html>
